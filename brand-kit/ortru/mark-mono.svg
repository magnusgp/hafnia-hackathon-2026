<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ortru guardian mark">
  <title>Ortru</title>
  <!-- Single colour: inherits currentColor. The gap between the heads and the eyes are real holes, so it works on any background. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="31.1" y="0" width="1.8" height="41" fill="#000"/>
      <circle cx="21" cy="29" r="4.7" fill="#000"/><circle cx="43" cy="29" r="4.7" fill="#000"/>
    </mask>
  </defs>
  <g fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="3" mask="url(#cut)">
    <rect x="15" y="38" width="34" height="21" rx="10.5" stroke="none"/>
    <path d="M14 14 C6 9.5 2.5 17 4 27.5 C5 33 10.5 31 12.5 24.5 Z"/><path d="M50 14 C58 9.5 61.5 17 60 27.5 C59 33 53.5 31 51.5 24.5 Z"/>
    <ellipse cx="21" cy="29" rx="10.5" ry="13" stroke="none"/><ellipse cx="43" cy="29" rx="10.5" ry="13" stroke="none"/>
  </g>
  <circle cx="19.7" cy="29" r="2.3" fill="currentColor"/><circle cx="44.3" cy="29" r="2.3" fill="currentColor"/>
</svg>
